name: Scheduled data pulls

# Two independent jobs. noaa-actuals is gated to its own single cron entry
# via github.event.schedule (a workflow_dispatch run defaults to firing both
# jobs, or pick one via the `job` input). open-meteo-live now runs off THREE
# cron entries at two different cadences, split by lead time (requested
# directly, 2026-08-10 -- reduce Open-Meteo load on far-out dates without
# losing freshness close to launch):
#   - T-0..T-3 (pipeline/launch_schedule.py's run_live_pulls_near()): every 6h,
#     unchanged from this job's original cadence -- per-site
#     config.SITES[...]["cron_cutoff_hour_utc"] still stops same-day (T-0)
#     pulls once a launch day is functionally over. Only ever produces one
#     stored point per model per UTC day regardless of how often this fires.
#   - T-4..T-7 (run_live_pulls_far()): twice daily, targeting real local
#     06:00/18:00 America/Chicago rather than a fixed UTC hour -- this far
#     out, one fresh pull covering the overnight model-run cycle and one
#     covering the day's later runs is enough; the extra two daily pulls this
#     replaces weren't buying meaningfully fresher data at that lead time.
#     Since Chicago's UTC offset flips with DST, this fires at all 4 UTC
#     times that could be 06:15/18:15 local across the two DST states
#     (00:15/11:15/12:15/23:15 -- 12:15 and 00:15 coincide with two of the
#     near-tier grid's own four entries below, so only 11:15/23:15 needed
#     adding as dedicated far-tier-only entries). Each slot passes
#     run_live_pulls_far() the UTC offset IT assumes via --assume-utc-offset
#     (below); that function no-ops if the actual current offset doesn't
#     match, i.e. this is the "other DST state's" slot right now.
#
#     This used to be one single "15 0,6,12,18 * * *" cron line with
#     run_live_pulls_far() attempted on every firing, self-gated by checking
#     `datetime.now(_SITE_TZ).hour` against (6, 18) at execution time. That
#     assumed a firing actually executes at its scheduled minute, which
#     GitHub Actions does not guarantee -- confirmed directly: this job's own
#     concurrency group below (cancel-in-progress: false) serializes all 6
#     daily firings, and once one backs up, every later firing that day
#     drifts further from its nominal time, until wall-clock hour no longer
#     matches 6 or 18 for ANY firing -- a full day (2026-08-30 16:38 through
#     2026-09-01 05:03 UTC) of far-tier pulls silently skipped, still
#     reporting "success", leaving T-5 (and that day's T-6/T-7) never
#     generated for any site. Split into 4 individual near-tier cron lines
#     (needed anyway so github.event.schedule can tell them apart) plus the
#     2 dedicated far-tier ones, each tagged with the offset ITS OWN slot
#     assumes rather than reading the clock at execution time -- immune to
#     ordinary scheduling delay, since DST only flips twice a year.
#
#     Fires at :15 past the hour, not exactly on the boundary -- a buffer for
#     Open-Meteo's own documented "eventually consistent" server sync (they
#     recommend waiting 10min after a run's availability time). This is NOT
#     an attempt to catch each model's own freshest run: real per-model
#     publish lag (checked via api.open-meteo.com/data/<model>/static/
#     meta.json) ranges ~80min (HRRR/NBM) to ~7h (ECMWF, longer than its own
#     6h cycle) -- no single fixed offset can target that for every model in
#     one request, since the live endpoint always serves whatever's currently
#     freshest rather than a pinned run. GEM's live feed was observed several
#     weeks stale, consistent with pull_historical.py's "GEM unreliable" note.
#   - noaa-actuals: the day-after HRRR-analysis "actual" pull
#     (run_actual_pulls()) for whichever site(s) launched yesterday (UTC).
#     Deliberately not same-day -- HRRR's own AWS archive needs a full day to
#     finish publishing. Pulled directly from NOAA's AWS archive via Herbie,
#     not through Open-Meteo -- the sync-race note above doesn't apply here.
# Both commit pipeline/data + site/data + site/maps back to main when
# they've actually changed something -- required for the data to survive past
# this ephemeral runner. That push does NOT trigger pages.yml's own `on:
# push` deploy, though -- GitHub suppresses workflow-triggering-workflow for
# the default GITHUB_TOKEN specifically to prevent infinite loops, which
# silently applies here too even though this isn't a loop: a scheduled run
# can pull and commit real data successfully with no error, yet never fire
# pages.yml. So each "commit and push" step here explicitly dispatches
# pages.yml afterward via the API (gh workflow run), which is NOT subject to
# that same suppression -- only the automatic push-event trigger is.

on:
  schedule:
    - cron: "15 0 * * *"   # open-meteo-live near-tier + far-tier's CST-PM candidate (00:15 UTC = 18:15 CST)
    - cron: "15 6 * * *"   # open-meteo-live near-tier only -- never a valid far-tier local-6/18 time in either DST state
    - cron: "15 11 * * *"  # open-meteo-live far-tier only (T-4..T-7): CDT-AM candidate (11:15 UTC = 06:15 CDT)
    - cron: "15 12 * * *"  # open-meteo-live near-tier + far-tier's CST-AM candidate (12:15 UTC = 06:15 CST)
    - cron: "15 18 * * *"  # open-meteo-live near-tier only -- never a valid far-tier local-6/18 time in either DST state
    - cron: "15 23 * * *"  # open-meteo-live far-tier only (T-4..T-7): CDT-PM candidate (23:15 UTC = 18:15 CDT)
    - cron: "0 11 * * *"   # noaa-actuals, once daily
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [both, live, actuals]
        default: both
      site:
        description: "Manual live pull only: site_id to force-pull outside the normal T-0..T-7 window (leave blank for the normal launch_schedule.py-gated behavior)"
        type: string
        default: ""
      date:
        description: "Manual live pull only: target launch date (YYYY-MM-DD) -- required if site is set"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  open-meteo-live:
    if: >
      (github.event_name == 'schedule' && github.event.schedule != '0 11 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'actuals')
    runs-on: ubuntu-latest
    concurrency:
      group: cron-pulls-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r pipeline/requirements-live.txt
      - name: Pull upcoming-launch forecasts (Open-Meteo)
        working-directory: pipeline
        # A manual dispatch with `site` set bypasses launch_schedule.py's own
        # T-0..T-7 gate entirely and pulls that exact site/date directly --
        # for showing a club real forecast data before their own launch is
        # within the normal window. Both steps, same order run_pulls_for()
        # itself uses -- pull_live_forecast.py alone only writes the raw
        # capture parquet; splash_zones.py is what actually builds the
        # published site/data/ viewer JSON.
        #
        # A manual dispatch with no `site` set runs the plain, unconditional
        # --run-live (full T-0..T-7, see run_live_pulls()'s own comment) --
        # gating a deliberate manual trigger on local time of day the same
        # way the scheduled far-tier pull below does would just be surprising
        # UX for a one-off "pull now" request.
        #
        # The scheduled cron trigger instead runs the near/far split: near
        # (T-0..T-3) on every one of the 4 individual 6h-grid entries above
        # (15 0/6/12/18 UTC -- split into separate cron lines specifically so
        # github.event.schedule can tell them apart, see this file's own
        # top comment); far (T-4..T-7) only on the 2 slots that are actually
        # DST candidates for that grid (00:15, 12:15) plus the 2 dedicated
        # far-tier-only entries (11:15, 23:15), each passed the UTC offset
        # ITS OWN slot assumes -- run_live_pulls_far() no-ops if that's not
        # the DST state actually in effect right now.
        run: |
          if [ -n "${{ github.event.inputs.site }}" ]; then
            python pull_live_forecast.py "${{ github.event.inputs.date }}" --site "${{ github.event.inputs.site }}"
            python splash_zones.py "${{ github.event.inputs.date }}" --site "${{ github.event.inputs.site }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python launch_schedule.py --run-live
          else
            case "${{ github.event.schedule }}" in
              "15 0 * * *"|"15 6 * * *"|"15 12 * * *"|"15 18 * * *")
                python launch_schedule.py --run-live-near
                ;;
            esac
            case "${{ github.event.schedule }}" in
              "15 11 * * *") python launch_schedule.py --run-live-far --assume-utc-offset -5 ;;  # CDT-AM
              "15 12 * * *") python launch_schedule.py --run-live-far --assume-utc-offset -6 ;;  # CST-AM
              "15 23 * * *") python launch_schedule.py --run-live-far --assume-utc-offset -5 ;;  # CDT-PM
              "15 0 * * *")  python launch_schedule.py --run-live-far --assume-utc-offset -6 ;;  # CST-PM
            esac
          fi
      - name: Commit and push updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/data site/data site/maps
          if git diff --cached --quiet; then
            echo "no data changes"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Automated Open-Meteo pull: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

  noaa-actuals:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 11 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'live')
    runs-on: ubuntu-latest
    concurrency:
      group: cron-pulls-actuals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r pipeline/requirements.txt
      - name: Pull HRRR-analysis actuals for yesterday's launches (NOAA)
        working-directory: pipeline
        run: python launch_schedule.py --run-actuals
      - name: Commit and push updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/data site/data site/maps
          if git diff --cached --quiet; then
            echo "no data changes"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Automated NOAA actuals pull: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
